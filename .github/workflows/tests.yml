name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps needed to import the modules under test, plus pytest.
          pip install geopandas shapely pyproj fiona folium jinja2 fpdf2 openpyxl pytest

      - name: Run tests
        run: pytest tests/ -q
